[workspace]
members = ["crates/splice-commit","crates/splice-media"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Akash Kumar Sinha"]

[workspace.dependencies]
splice-media = { path = "crates/splice-media" }
splice-commit = { path = "crates/splice-commit" }
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
rusqlite = { version = "0.32", features = ["bundled", "time", "uuid"] }
tempfile = "3.12"

