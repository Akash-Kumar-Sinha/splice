[workspace]
members = ["crates/splice-api","crates/splice-commit","crates/splice-media"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Akash Kumar Sinha"]

[workspace.dependencies]
splice-media = { path = "crates/splice-media" }
splice-commit = { path = "crates/splice-commit" }
sha2 = "0.11.0"
hex = "0.4.3"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled", "time", "uuid"] }
tempfile = "3.27.0"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

http = "1.5.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
